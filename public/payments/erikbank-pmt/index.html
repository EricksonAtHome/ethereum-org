<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikBank Pmt</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    font-family: 'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 40px 20px;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 15% 105%, #fcd9ad 0%, #fcd9ad 22%, transparent 45%),
      radial-gradient(circle at 90% 15%, #f3934a 0%, #f3934a 30%, transparent 55%),
      linear-gradient(160deg, #f7a24e 0%, #f0813a 45%, #e8672c 100%);
  }

  body::before {
    content: "";
    position: absolute;
    inset: -10%;
    background:
      radial-gradient(circle at 20% 100%, rgba(255, 222, 173, 0.9) 0%, rgba(255, 222, 173, 0) 40%),
      radial-gradient(circle at 100% 0%, rgba(255, 170, 100, 0.75) 0%, rgba(255, 170, 100, 0) 42%);
    pointer-events: none;
  }

  .stack {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .card {
    background: #fdf6ec;
    border-radius: 32px;
    padding: 40px 36px;
    box-shadow: 0 30px 60px rgba(120, 60, 10, 0.18);
  }

  .payee {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
  }

  .avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    border: 2px solid #fff;
  }

  .payee-info p {
    font-size: 13px;
    color: #9a8f80;
    margin-bottom: 2px;
  }

  .payee-info h3 {
    font-size: 16px;
    font-weight: 600;
    color: #14140f;
  }

  .amount-label {
    font-size: 15px;
    color: #9a8f80;
    margin-bottom: 6px;
  }

  .amount {
    font-size: 48px;
    font-weight: 600;
    color: #14140f;
    letter-spacing: -1px;
    margin-bottom: 32px;
  }

  .amount span {
    font-size: 28px;
    color: #c9bfae;
    font-weight: 500;
    margin-left: 6px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    gap: 18px;
    background: #14140f;
    color: #fdf6ec;
    border: none;
    border-radius: 999px;
    padding: 8px 8px 8px 32px;
    font-size: 19px;
    font-weight: 500;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.25); }
  .btn:active { transform: translateY(0); }

  .btn .arrow {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #dcf29a;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .btn .arrow svg { width: 20px; height: 20px; }

  .card.method {
    padding: 32px;
  }

  .method-title {
    font-size: 20px;
    font-weight: 600;
    color: #14140f;
    margin-bottom: 20px;
  }

  .tabs {
    display: flex;
    background: #f1e9db;
    border-radius: 999px;
    padding: 4px;
    margin-bottom: 22px;
  }

  .tab {
    flex: 1;
    text-align: center;
    padding: 10px 0;
    font-size: 14px;
    font-weight: 600;
    color: #9a8f80;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }

  .tab.active {
    background: #14140f;
    color: #fdf6ec;
  }

  .panel { display: none; }
  .panel.active { display: block; }

  .bank-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .bank-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 14px;
    border-radius: 16px;
    border: 1px solid #eee0cd;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }

  .bank-row:hover {
    border-color: #14140f;
    background: #fff;
  }

  .bank-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
  }

  .bank-row span { font-size: 15px; font-weight: 500; color: #14140f; }

  .bank-row .check {
    margin-left: auto;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid #d9cdb8;
    flex-shrink: 0;
  }

  .bank-row.selected { border-color: #14140f; background: #fff; }
  .bank-row.selected .check {
    border-color: #14140f;
    background: #dcf29a;
    position: relative;
  }
  .bank-row.selected .check::after {
    content: "";
    position: absolute;
    inset: 0;
    margin: auto;
    width: 5px;
    height: 9px;
    border-right: 2px solid #14140f;
    border-bottom: 2px solid #14140f;
    transform: rotate(45deg) translate(-1px, -2px);
  }

  .qr-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 8px 0 4px;
  }

  .qr-box {
    width: 180px;
    height: 180px;
    background: #fff;
    border-radius: 20px;
    padding: 14px;
    box-shadow: 0 8px 20px rgba(120, 60, 10, 0.08);
    margin-bottom: 18px;
  }

  .qr-box svg { width: 100%; height: 100%; }

  .qr-wrap p {
    font-size: 14px;
    color: #9a8f80;
    max-width: 260px;
    line-height: 1.5;
  }

  .qr-wrap p strong { color: #14140f; }

  @media (max-width: 480px) {
    .card { padding: 28px 24px; border-radius: 24px; }
    .amount { font-size: 38px; }
    .btn { font-size: 17px; padding: 6px 6px 6px 24px; gap: 14px; }
    .btn .arrow { width: 40px; height: 40px; }
  }
</style>
</head>
<body>

  <div class="stack">

    <div class="card">
      <div class="payee">
        <img class="avatar" src="https://i.pravatar.cc/96?img=12" alt="Payee">
        <div class="payee-info">
          <p>Pay to</p>
          <h3>Sanne de Vries</h3>
        </div>
      </div>

      <p class="amount-label">Amount to pay</p>
      <div class="amount">€49<span>,99</span></div>

      <button class="btn" type="button">
        Pay now
        <span class="arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="#14140f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </span>
      </button>
    </div>

    <div class="card method">
      <div class="method-title">Choose payment method</div>

      <div class="tabs">
        <div class="tab active" data-tab="bank">Bank</div>
        <div class="tab" data-tab="qr">QR code</div>
      </div>

      <div class="panel active" id="panel-bank">
        <div class="bank-list">
          <div class="bank-row selected">
            <div class="bank-icon" style="background:#e8672c;">EB</div>
            <span>ErikBank</span>
            <div class="check"></div>
          </div>
          <div class="bank-row">
            <div class="bank-icon" style="background:#14140f;">DN</div>
            <span>Danske Bank</span>
            <div class="check"></div>
          </div>
          <div class="bank-row">
            <div class="bank-icon" style="background:#4a90d9;">NO</div>
            <span>Nordea</span>
            <div class="check"></div>
          </div>
          <div class="bank-row">
            <div class="bank-icon" style="background:#7a8f4a;">SE</div>
            <span>SEB</span>
            <div class="check"></div>
          </div>
        </div>
      </div>

      <div class="panel" id="panel-qr">
        <div class="qr-wrap">
          <div class="qr-box">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
              <rect width="100" height="100" fill="#fff"/>
              <g fill="#14140f">
                <rect x="4" y="4" width="22" height="22"/>
                <rect x="9" y="9" width="12" height="12" fill="#fff"/>
                <rect x="13" y="13" width="4" height="4"/>
                <rect x="74" y="4" width="22" height="22"/>
                <rect x="79" y="9" width="12" height="12" fill="#fff"/>
                <rect x="83" y="13" width="4" height="4"/>
                <rect x="4" y="74" width="22" height="22"/>
                <rect x="9" y="79" width="12" height="12" fill="#fff"/>
                <rect x="13" y="83" width="4" height="4"/>
                <rect x="32" y="4" width="4" height="4"/><rect x="40" y="4" width="4" height="4"/><rect x="52" y="4" width="4" height="4"/>
                <rect x="32" y="12" width="4" height="4"/><rect x="44" y="12" width="4" height="4"/><rect x="60" y="12" width="4" height="4"/>
                <rect x="36" y="20" width="4" height="4"/><rect x="52" y="20" width="4" height="4"/><rect x="64" y="20" width="4" height="4"/>
                <rect x="4" y="32" width="4" height="4"/><rect x="12" y="32" width="4" height="4"/><rect x="24" y="32" width="4" height="4"/>
                <rect x="32" y="32" width="4" height="4"/><rect x="44" y="32" width="4" height="4"/><rect x="56" y="32" width="4" height="4"/><rect x="72" y="32" width="4" height="4"/><rect x="88" y="32" width="4" height="4"/>
                <rect x="8" y="40" width="4" height="4"/><rect x="20" y="40" width="4" height="4"/><rect x="36" y="40" width="4" height="4"/>
                <rect x="48" y="40" width="4" height="4"/><rect x="64" y="40" width="4" height="4"/><rect x="80" y="40" width="4" height="4"/><rect x="92" y="40" width="4" height="4"/>
                <rect x="4" y="48" width="4" height="4"/><rect x="16" y="48" width="4" height="4"/><rect x="32" y="48" width="4" height="4"/>
                <rect x="52" y="48" width="4" height="4"/><rect x="68" y="48" width="4" height="4"/><rect x="84" y="48" width="4" height="4"/>
                <rect x="12" y="56" width="4" height="4"/><rect x="28" y="56" width="4" height="4"/><rect x="44" y="56" width="4" height="4"/>
                <rect x="60" y="56" width="4" height="4"/><rect x="76" y="56" width="4" height="4"/><rect x="92" y="56" width="4" height="4"/>
                <rect x="32" y="64" width="4" height="4"/><rect x="48" y="64" width="4" height="4"/><rect x="64" y="64" width="4" height="4"/>
                <rect x="80" y="64" width="4" height="4"/>
                <rect x="36" y="72" width="4" height="4"/><rect x="52" y="72" width="4" height="4"/><rect x="68" y="72" width="4" height="4"/>
                <rect x="84" y="72" width="4" height="4"/><rect x="92" y="72" width="4" height="4"/>
                <rect x="32" y="80" width="4" height="4"/><rect x="44" y="80" width="4" height="4"/><rect x="60" y="80" width="4" height="4"/>
                <rect x="76" y="80" width="4" height="4"/><rect x="88" y="80" width="4" height="4"/>
                <rect x="36" y="88" width="4" height="4"/><rect x="48" y="88" width="4" height="4"/><rect x="64" y="88" width="4" height="4"/>
                <rect x="80" y="88" width="4" height="4"/><rect x="92" y="88" width="4" height="4"/>
              </g>
            </svg>
          </div>
          <p>Scan with your ErikBank app to pay <strong>€49,99</strong> to Sanne de Vries</p>
        </div>
      </div>
    </div>

  </div>

  <script>
    const tabs = document.querySelectorAll('.tab');
    const panels = { bank: document.getElementById('panel-bank'), qr: document.getElementById('panel-qr') };

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        Object.values(panels).forEach(p => p.classList.remove('active'));
        panels[tab.dataset.tab].classList.add('active');
      });
    });

    document.querySelectorAll('.bank-row').forEach(row => {
      row.addEventListener('click', () => {
        document.querySelectorAll('.bank-row').forEach(r => r.classList.remove('selected'));
        row.classList.add('selected');
      });
    });
  </script>

</body>
</html>
